[pytest]
; Makes `custom_components` importable as a real package from the repo
; root, matching Home Assistant's OWN runtime import path
; (`custom_components.honeywell_smileconnect...`) exactly - rather than
; the previous approach of pointing pythonpath directly at
; custom_components/ to flatten the prefix away, which turned out to
; conflict with pytest-homeassistant-custom-component's own expectations
; about the custom_components namespace (see CLAUDE.md "Test Suite" for
; the debugging story). Requires custom_components/__init__.py to exist
; (added alongside this change) so it resolves as a regular package.
pythonpath = .
testpaths = tests
