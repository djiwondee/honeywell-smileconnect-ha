services:
  homeassistant:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    container_name: hsc_dev_homeassistant
    working_dir: /workspace
    command: >
      bash -c "pip install --quiet homeassistant pycryptodome &&
               ln -sfn /workspace/custom_components/honeywell_smileconnect
                       /workspace/config/custom_components/honeywell_smileconnect &&
               hass --config /workspace/config --debug"
    volumes:
      - ./:/workspace:cached
    ports:
      - "8123:8123"
    environment:
      - TZ=Europe/Berlin
    restart: unless-stopped

  # Optional: point this at the real gateway's LAN IP for live testing
  # scripts (see docs/protocol.md). Not a service - just documents the
  # target host so it's not forgotten between sessions.
  # gateway-host: 192.168.1.132
