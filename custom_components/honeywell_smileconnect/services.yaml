set_preset_mode_with_duration:
  target:
    entity:
      domain: climate
      integration: honeywell_smileconnect
  fields:
    preset_mode:
      required: true
      selector:
        select:
          options:
            - "none"
            - "Boost"
            - "Party"
            - "Holiday"
            - "Leave"
    target:
      required: false
      selector:
        number:
          min: 0
          max: 500
          step: 0.5
          mode: box

set_hvac_mode_and_temperature:
  target:
    entity:
      domain: climate
      integration: honeywell_smileconnect
  fields:
    hvac_mode:
      required: true
      selector:
        select:
          options:
            - "auto"
            - "off"
    temperature:
      required: false
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          mode: box
