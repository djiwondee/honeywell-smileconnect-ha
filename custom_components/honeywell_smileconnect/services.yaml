set_preset_mode_with_duration:
  target:
    entity:
      domain: climate
      integration: honeywell_smileconnect
  fields:
    preset_mode:
      required: true
      selector:
        select:
          options:
            - "none"
            - "Boost"
            - "Party"
            - "Holiday"
            - "Leave"
    target:
      required: false
      selector:
        number:
          min: 0
          max: 500
          step: 0.5
          mode: box
    duration:
      required: false
      selector:
        number:
          min: 0
          max: 500
          step: 0.01
          mode: box
